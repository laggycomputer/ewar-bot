[package]
name = "ewar-bot"
version = "1.0.0"
edition = "2021"

[dependencies]
async-std = "1.13.2"
bson = { version = "3.0.0", features = ["chrono-0_4"] }
chrono = "0.4.42"
clap = { version = "4.5.54", features = ["cargo"] }
discord-md = "3.0.0"
dotenvy = "0.15.7"
futures = "0.3.31"
gix = "0.77.0"
itertools = "0.14.0"
mongodb = { version = "3.4.1", features = ["bson-3"] }
pluralizer = "0.5.0"
poise = "0.6.1"
rand = "0.9.2"
regex = "1.11.2"
serde = "1.0.228"
serenity = "0.12.5"
skillratings = "0.28.2"
timeago = "0.5.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tokio-cron = "0.1.3"

