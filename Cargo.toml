rand = "0.9.2"
gix = "0.73.0"
discord-md = "3.0.0"
timeago = "0.5.0"
chrono = "0.4.42"
regex = "1.11.2"
async-std = "1.13.2"
tokio-cron = "0.1.3"
dotenv = "0.15.0"
