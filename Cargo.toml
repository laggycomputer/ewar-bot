[package]
name = "ewar-bot"
version = "1.0.0"
edition = "2021"

[dependencies]
poise = "0.6.1"
serenity = "0.12.4"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
clap = { version = "4.5.49", features = ["cargo"] }
itertools = "0.14.0"
pluralizer = "0.5.0"
serde = "1.0.228"
futures = "0.3.31"
mongodb = "3.3.0"
